<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B4B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캠핑준비">
<title>제천 캠핑 준비</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 열 현황판. 맨 위에 필수 진행률, 그 아래 필터와 분류별 목록, 맨 아래 전기 합계와 일정. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#14211C; --muted:#56675F; --line:#D2DBD6;
  --accent:#1E5B4B; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --must:#9A3A0C; --must-soft:#F8E4D8;
  --ok:#1F7A4A; --ok-soft:#DDF0E5; --bad:#A8271F; --bad-soft:#F6DEDB;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#17221E; --ink:#E6EFEA; --muted:#93A59C; --line:#2A3A34;
    --accent:#5FC2A1; --accent-ink:#0B1512; --accent-soft:#1D3A31;
    --must:#FFA57A; --must-soft:#3B2218;
    --ok:#6FD39A; --ok-soft:#173326; --bad:#FF8F86; --bad-soft:#3A1D1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#17221E; --ink:#E6EFEA; --muted:#93A59C; --line:#2A3A34;
  --accent:#5FC2A1; --accent-ink:#0B1512; --accent-soft:#1D3A31;
  --must:#FFA57A; --must-soft:#3B2218;
  --ok:#6FD39A; --ok-soft:#173326; --bad:#FF8F86; --bad-soft:#3A1D1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{zoom:var(--ui,1);width:100%;margin:0;padding-inline:max(12px,env(safe-area-inset-left),env(safe-area-inset-right));padding-block:20px 56px;display:grid;gap:16px}
.eyebrow{margin:0;color:var(--muted);font-size:12px;letter-spacing:.08em}
h1{margin:2px 0 6px;font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.15;text-wrap:balance}
.dates{margin:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted)}
.dday{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.banner{margin:0;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--must-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:20px}
.prog-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prog-num{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.prog-lbl{color:var(--muted)}
.bar{margin-top:12px;height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.prog-sub{margin:10px 0 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cat+.cat{margin-top:12px}
.cat-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:0;background:transparent;text-align:left}
.cat-nm{font-family:var(--f-display);font-size:18px}
.cat-ct{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;font-weight:700;color:var(--accent-ink)}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.chk:disabled{cursor:default;opacity:.6}
.head{display:grid;gap:4px;width:100%;border:0;background:transparent;padding:0;text-align:left}
.nm{font-weight:500;overflow-wrap:anywhere}
.is-done .nm{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag,.who{font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.t-must{background:var(--must-soft);border-color:transparent;color:var(--must);font-weight:600}
.who{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.nt{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.detail{margin-top:10px;display:grid;gap:10px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
textarea,input[type=text],input[type=number],select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:16px}
textarea{resize:vertical}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row select{width:auto;min-width:120px}
.danger{border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:8px;padding:6px 12px;min-height:36px}
.danger.yes{background:var(--bad);color:var(--surface)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;min-height:36px}
.empty{margin:0;padding:18px 14px;color:var(--muted)}
form.add{display:grid;gap:10px}
form.add .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;min-height:44px;padding:8px 16px;font-weight:600}
.primary:disabled{opacity:.5;cursor:default}
.hint{margin:10px 0 0;color:var(--muted);font-size:13px}
dl.sched{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px}
dl.sched dt{font-weight:600;font-variant-numeric:tabular-nums}
dl.sched dd{margin:0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;text-align:center;z-index:10}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s ease}}
.links{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums}
.links a:hover{border-color:var(--accent)}
.wx{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.wx-day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.wx-d{font-size:12px;color:var(--muted);letter-spacing:.04em}
.wx-t{font-family:var(--f-display);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.wx-s{font-size:13px;color:var(--muted)}
.wx-r{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:12px;padding:3px 8px;border-radius:999px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--must-soft);color:var(--must)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.wx-note{margin:8px 0 0;font-size:12px;color:var(--muted)}
.wx-note a{color:var(--accent)}
.mapbtn{display:inline-flex;align-items:center;min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.mapbtn:hover{border-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{position:relative;max-width:min(900px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:8px}
.modal-box img{width:100%;height:auto;display:block;border-radius:8px}
.modal-x{justify-self:end;min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
html{-webkit-text-size-adjust:100%}
.zoomctl{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.zoomctl button{min-width:40px;min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.zoomctl button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zoomctl .zl{font-size:12px;color:var(--muted);margin-right:2px}
</style>
</head>

조명·식사","name":"음식 뚜껑과 쓰레기봉투","req":"필수","note":"말벌 대비"},{"id":"i35","cat":"조명·식사","name":"추가 테이블","req":"권장","note":""},{"id":"i36","cat":"조명·식사","name":"숯","req":"권장","note":""},{"id":"i31","cat":"물놀이·상비","name":"수영복, 래시가드, 수영모","req":"필수","note":"수영모 필수"},{"id":"i32","cat":"물놀이·상비","name":"갈아입을 옷과 수건","req":"필수","note":"젖은 채 이동하면 체온이 떨어짐"},{"id":"i33","cat":"물놀이·상비","name":"해열제, 체온계, 밴드","req":"필수","note":""}];
var mode="loading";
var items=new Map();
var filter="all", openId=null, confirmId=null, editing=false, dirty=false;
var collapsed=new Set(CATS);
var db=null;
var WEATHER={"asOf":"2026-10-03 20:10","source":"AccuWeather 제천, 기상청 충북","days":[{"date":"2026-10-09","tmin":9,"tmax":24,"sky":"흐릿함","pop":0,"kma":"맑음","kmaPop":10},{"date":"2026-10-10","tmin":10,"tmax":26,"sky":"흐릿하고 따뜻함","pop":0,"kma":"맑음","kmaPop":10},{"date":"2026-10-11","tmin":9,"tmax":26,"sky":"대체로 맑음","pop":0,"kma":"맑음","kmaPop":10}]};
var weather=WEATHER;
var chains=new Map();
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3500)}
function canWrite(){return mode==="shared"||mode==="local"}
function norm(d){
  d=d||{};
  return {cat:CATS.indexOf(d.cat)>=0?d.cat:CATS[0],name:String(d.name||""),req:REQS.indexOf(d.req)>=0?d.req:"권장",
    note:String(d.note||""),done:!!d.done,who:WHO.indexOf(d.who)>=0?d.who:"",order:typeof d.order==="number"?d.order:9999};
}
function list(){
  var a=[];items.forEach(function(d,id){a.push(Object.assign({id:id},d))});
  return a.sort(function(x,y){return (x.order-y.order)||(x.id<y.id?-1:1)});
}
function enqueue(key,fn){
  var prev=chains.get(key)||Promise.resolve();
  var next=prev.then(fn);
  chains.set(key,next.catch(function(){}));
  return next;
}
function lsSave(){
  try{var o={items:{}};items.forEach(function(d,id){o.items[id]=d});localStorage.setItem(LS_KEY,JSON.stringify(o))}catch(e){}
}
function lsLoad(){
  var ok=false;
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){var o=JSON.parse(raw);Object.keys(o.items||{}).forEach(function(id){items.set(id,norm(o.items[id]))});ok=true}
  }catch(e){}
  if(!ok){DEFAULTS.forEach(function(d,i){items.set(d.id,norm(Object.assign({done:false,who:"",order:i+1},d)))})}
}
function onWriteErr(){toast("저장하지 못했습니다. 편집 권한이 없거나 항목이 삭제됐을 수 있습니다.")}
function patchItem(id,patch){
  if(!canWrite()||!items.has(id))return;
  items.set(id,Object.assign({},items.get(id),patch));
  renderAll();
  if(mode==="local"){lsSave();return}
  enqueue(id,function(){return db.doc("items/"+id).update(patch)}).catch(onWriteErr);
}
function addItem(cat,name,req){
  var max=0;items.forEach(function(d){if(d.order>max&&d.order<9999)max=d.order});
  var id="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  var doc=norm({cat:cat,name:name,req:req,note:"",done:false,who:"",order:max+1});
  items.set(id,doc);collapsed.delete(cat);
  renderAll();
  if(mode==="local"){lsSave();return}
  enqueue(id,function(){return db.doc("items/"+id).set(doc)}).catch(onWriteErr);
}
function removeItem(id){
  if(!canWrite())return;
  items.delete(id);openId=null;confirmId=null;
  renderAll();
  if(mode==="local"){lsSave();return}
  enqueue(id,function(){return db.doc("items/"+id).delete()}).catch(onWriteErr);
}
function dday(){
  var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var s=new Date(2026,9,9),e=new Date(2026,9,11);
  var d=Math.round((s-t)/864e5);
  if(d>0)return "D-"+d;
  if(d===0)return "D-DAY";
  return t<=e?"캠핑 중":"종료";
}
function renderBanner(){
  var b=$("#banner");
  if(mode==="local"){b.hidden=false;b.className="banner warn";b.textContent="서버 저장소에 연결하지 못해 이 기기에만 저장됩니다."}
  else if(mode==="readonly"){b.hidden=false;b.className="banner warn";b.textContent="보기 전용입니다. 체크하고 메모하려면 편집 권한(기여자)이 필요합니다."}
  else if(mode==="shared"){b.hidden=false;b.className="banner";b.textContent="공유 중입니다. 체크와 메모가 열려 있는 모든 화면에 바로 반영됩니다."}
  else{b.hidden=true}
}
function renderProgress(){
  var a=list(),must=a.filter(function(i){return i.req==="필수"}),md=must.filter(function(i){return i.done}).length;
  var done=a.filter(function(i){return i.done}).length;
  var pct=must.length?Math.round(md/must.length*100):(a.length?Math.round(done/a.length*100):0);
  var left=must.length-md;
  var h='<div class="prog-top"><span class="prog-num">'+md+'/'+must.length+'</span><span class="prog-lbl">필수 항목 준비됨</span></div>';
  h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="필수 항목 진행률"><i style="width:'+pct+'%"></i></div>';
  h+='<p class="prog-sub">'+(mode==="loading"?"불러오는 중":(must.length&&left===0?"필수 항목을 모두 준비했습니다. ":"남은 필수 "+left+"개 · "))+'전체 '+done+'/'+a.length+'</p>';
  $("#progress").innerHTML=h;
}
function renderFilters(){
  var defs=[["all","전체"],["todo","미완료"],["must","필수 미완료"],["남편","남편 담당"],["아내","아내 담당"]];
  $("#filters").innerHTML=defs.map(function(f){return '<button type="button" class="fbtn" data-act="filter" data-v="'+esc(f[0])+'" aria-pressed="'+(filter===f[0])+'">'+esc(f[1])+'</button>'}).join("")+'<button type="button" class="fbtn" data-act="all">'+(collapsed.size?"모두 펼치기":"모두 접기")+'</button>';
}
function pass(i){
  if(filter==="todo")return !i.done;
  if(filter==="must")return i.req==="필수"&&!i.done;
  if(filter==="남편"||filter==="아내")return i.who===filter;
  return true;
}
function itemHTML(it){
  var dis=canWrite()?"":" disabled",ro=canWrite()?"":" readonly",open=openId===it.id,i=esc(it.id);
  var h='<li class="item'+(it.done?' is-done':'')+'" data-id="'+i+'">';
  h+='<button type="button" class="chk" role="checkbox" aria-checked="'+it.done+'" aria-label="'+esc(it.name)+' 준비 완료" data-act="toggle"'+dis+'><span aria-hidden="true">'+(it.done?'✓':'')+'</span></button>';
  h+='<div><button type="button" class="head" data-act="open" aria-expanded="'+open+'"><span class="nm">'+esc(it.name)+'</span><span class="meta"><span class="tag'+(it.req==="필수"?' t-must':'')+'">'+esc(it.req)+'</span>'+(it.who?'<span class="who">'+esc(it.who)+'</span>':'')+'</span>'+((it.note&&!open)?'<span class="nt">'+esc(it.note)+'</span>':'')+'</button>';
  if(open){
    h+='<div class="detail"><div><label class="lbl" for="name-'+i+'">항목 이름</label><input type="text" id="name-'+i+'" maxlength="80" value="'+esc(it.name)+'" data-field="name"'+ro+'></div>';
    h+='<div class="row"><label class="lbl" for="cat-'+i+'">분류</label><select id="cat-'+i+'" data-field="cat"'+dis+'>'+CATS.map(function(c){return '<option'+(it.cat===c?' selected':'')+'>'+esc(c)+'</option>'}).join("")+'</select></div>';
    h+='<div><label class="lbl" for="note-'+i+'">메모</label><textarea id="note-'+i+'" rows="3" maxlength="500" data-field="note"'+ro+'>'+esc(it.note)+'</textarea></div>';
    h+='<div class="row"><span class="lbl">담당</span><div class="seg">'+WHO.map(function(w){return '<button type="button" data-act="who" data-v="'+esc(w)+'" aria-pressed="'+(it.who===w)+'"'+dis+'>'+(w||"미정")+'</button>'}).join("")+'</div></div>';
    h+='<div class="row"><label class="lbl" for="req-'+i+'">중요도</label><select id="req-'+i+'" data-field="req"'+dis+'>'+REQS.map(function(r){return '<option'+(it.req===r?' selected':'')+'>'+r+'</option>'}).join("")+'</select></div>';
    if(canWrite()){
      h+='<div class="row">'+(confirmId===it.id?'<button type="button" class="danger yes" data-act="del-yes">삭제 확인</button><button type="button" class="ghost" data-act="del-no">취소</button>':'<button type="button" class="danger" data-act="del">항목 삭제</button>')+'</div>';
    }
    h+='</div>';
  }
  return h+'</div></li>';
}
function renderList(){
  var ae=document.activeElement,key=null;
  if(ae&&ae.dataset&&ae.dataset.act){var li=ae.closest("[data-id]");if(li)key=[li.dataset.id,ae.dataset.act,ae.dataset.v||""]}
  var all=list(),h="";
  if(mode==="loading"){h='<div class="card"><p class="empty">불러오는 중입니다.</p></div>'}
  else if(!all.length){h='<div class="card"><p class="empty">아직 항목이 없습니다. 아래 항목 추가에서 첫 항목을 넣어 주세요.</p></div>'}
  else{
    var any=false;
    CATS.forEach(function(c){
      var inCat=all.filter(function(i){return i.cat===c}),shown=inCat.filter(pass);
      if(!inCat.length||!shown.length)return;
      any=true;
      var d=inCat.filter(function(i){return i.done}).length,col=collapsed.has(c);
      h+='<section class="cat" data-cat="'+esc(c)+'"><button type="button" class="cat-h" data-act="cat" aria-expanded="'+(!col)+'"><span class="cat-nm">'+esc(c)+'</span><span class="cat-ct">'+d+'/'+inCat.length+'</span></button><ul class="items"'+(col?' hidden':'')+'>'+shown.map(itemHTML).join("")+'</ul></section>';
    });
    if(!any)h='<div class="card"><p class="empty">해당하는 항목이 없습니다.</p></div>';
  }
  $("#list").innerHTML=h;
  if(key){var el=$('[data-id="'+key[0]+'"] [data-act="'+key[1]+'"]'+(key[2]?'[data-v="'+key[2]+'"]':''));if(el&&!el.disabled)el.focus()}
}
function renderAdd(){
  var on=canWrite();
  ["#add-name","#add-cat","#add-req","#add-btn"].forEach(function(s){$(s).disabled=!on});
}
function dlabel(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return (+p[1])+"/"+(+p[2])+"("+"일월화수목금토".charAt(d.getDay())+")"}
function renderWeather(){
  var el=$("#weather"),w=weather;
  if(!w||!w.days||!w.days.length){el.innerHTML="";return}
  var h='<div class="wx">'+w.days.map(function(d){
    var p=Math.max(Number(d.pop)||0,Number(d.kmaPop)||0),cls=p>=60?"bad":(p>=30?"warn":"ok");
    return '<div class="wx-day"><span class="wx-d">'+esc(dlabel(d.date))+'</span><span class="wx-t">'+Math.round(d.tmin)+'° / '+Math.round(d.tmax)+'°</span><span class="wx-s">'+esc(d.sky||"")+'</span><span class="wx-r"><span class="pill '+cls+'">강수 '+(Number(d.pop)||0)+'%</span>'+(d.kma?'<span>기상청 '+esc(d.kma)+' '+(Number(d.kmaPop)||0)+'%</span>':'')+'</span></div>';
  }).join("")+'</div>';
  h+='<p class="wx-note">'+esc(w.source||"")+' · 기준 '+esc(w.asOf||"")+'. '+(w.live?'접속할 때 불러온 예보입니다. 기상청 단기예보와 다를 수 있으니 ':'저장된 예보입니다. 지금 예보는 ')+' <a href="https://www.weather.go.kr/w/forecast/overall/mid-term.do" target="_blank" rel="noopener">기상청</a> 또는 <a href="https://www.accuweather.com/ko/kr/jecheon/223116/10-day-weather-forecast/223116" target="_blank" rel="noopener">AccuWeather</a>에서 확인하세요.</p>';
  el.innerHTML=h;
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var m=$("#mapmodal");if(m)m.hidden=true}});
var ZK="jecheon-camp-zoom",zoomStep=0;
try{zoomStep=parseInt(localStorage.getItem(ZK)||"0",10)||0}catch(e){}
function applyZoom(){
  var vw=window.innerWidth||document.documentElement.clientWidth||400;
  var auto=Math.min(1.8,Math.max(1,1+(vw-400)/700));
  var ui=Math.min(3,Math.max(.8,auto*Math.pow(1.15,zoomStep)));
  document.documentElement.style.setProperty("--ui",ui.toFixed(3));
  var a=document.querySelector('[data-act="zoomauto"]');if(a)a.setAttribute("aria-pressed",String(zoomStep===0));
}
function setZoom(n){zoomStep=Math.max(-2,Math.min(5,n));try{localStorage.setItem(ZK,String(zoomStep))}catch(e){}applyZoom()}
window.addEventListener("resize",applyZoom);applyZoom();
function renderAll(){renderBanner();renderProgress();renderFilters();renderList();renderAdd()}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.dataset.act,li=el.closest("[data-id]"),id=li?li.dataset.id:null;
  if(act==="filter"){filter=el.dataset.v;if(filter!=="all")collapsed.clear();renderFilters();renderList();return}
  if(act==="zoom+"){setZoom(zoomStep+1);return}
  if(act==="zoom-"){setZoom(zoomStep-1);return}
  if(act==="zoomauto"){setZoom(0);return}
  if(act==="map"){$("#mapmodal").hidden=false;return}
  if(act==="mapclose"){if(e.target===el||el.classList.contains("modal-x"))$("#mapmodal").hidden=true;return}
  if(act==="all"){if(collapsed.size)collapsed.clear();else CATS.forEach(function(c){collapsed.add(c)});renderFilters();renderList();return}
  if(act==="cat"){var c=el.closest("[data-cat]").dataset.cat;if(collapsed.has(c))collapsed.delete(c);else collapsed.add(c);renderFilters();renderList();return}
  if(!id||!items.has(id))return;
  if(act==="open"){openId=openId===id?null:id;confirmId=null;renderList();return}
  if(act==="toggle"){patchItem(id,{done:!items.get(id).done});return}
  if(act==="who"){patchItem(id,{who:el.dataset.v});return}
  if(act==="del"){confirmId=id;renderList();return}
  if(act==="del-no"){confirmId=null;renderList();return}
  if(act==="del-yes"){removeItem(id);return}
});
document.addEventListener("change",function(e){
  var t=e.target,f=t.dataset&&t.dataset.field;if(!f)return;
  var li=t.closest("[data-id]");if(!li)return;
  var id=li.dataset.id,v=t.value;
  if(f==="note"){if(items.has(id)&&items.get(id).note!==v)patchItem(id,{note:v})}
  if(f==="name"){var nm=v.trim();if(!nm){t.value=items.has(id)?items.get(id).name:"";toast("항목 이름을 입력해 주세요.");return}if(items.has(id)&&items.get(id).name!==nm)patchItem(id,{name:nm})}
  if(f==="cat"&&CATS.indexOf(v)>=0){collapsed.delete(v);patchItem(id,{cat:v})}
  if(f==="req"&&REQS.indexOf(v)>=0)patchItem(id,{req:v});
});
document.addEventListener("focusin",function(e){if(e.target.matches&&e.target.matches("textarea[data-field],input[data-field]"))editing=true});
document.addEventListener("focusout",function(e){
  if(e.target.matches&&e.target.matches("textarea[data-field],input[data-field]")){editing=false;if(dirty){dirty=false;setTimeout(renderAll,0)}}
});
$("#addform").addEventListener("submit",function(e){
  e.preventDefault();
  var n=$("#add-name").value.trim();
  if(!n||!canWrite())return;
  addItem($("#add-cat").value,n,$("#add-req").value);
  $("#add-name").value="";
  toast("추가했습니다.");
});
function onItems(snap){
  var m=new Map();
  snap.docs.forEach(function(d){if(d.exists)m.set(d.id,norm(d.data()))});
  items=m;
  if(editing){dirty=true;return}
  renderAll();
}
async function init(){
  $("#dday").textContent=dday();
  $("#add-cat").innerHTML=CATS.map(function(c){return '<option>'+esc(c)+'</option>'}).join("");
  renderAll();renderWeather();
  var last="", inflight=0, failed=0;
  function api(body){
    inflight++;
    return fetch("/api/items",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw new Error("save")}).finally(function(){inflight--});
  }
  db={doc:function(p){var id=p.split("/")[1];return {
    update:function(patch){return api({op:"patch",id:id,patch:patch})},
    set:function(doc){return api({op:"set",id:id,doc:doc})},
    delete:function(){return api({op:"del",id:id})}}}};
  function apply(obj){
    var s=JSON.stringify(obj);if(s===last)return;last=s;
    var m=new Map();Object.keys(obj).forEach(function(k){m.set(k,norm(obj[k]))});
    items=m;if(editing){dirty=true;return}renderAll();
  }
  function poll(){
    if(inflight>0||document.hidden)return Promise.resolve();
    return fetch("/api/items",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("load");return r.json()})
      .then(function(j){failed=0;if(inflight===0&&mode!=="shared"){mode="shared";renderAll()}apply(j.items||{})});
  }
  try{await poll()}catch(e){mode="local";lsLoad();renderAll();var bn=$("#banner");bn.textContent="서버 저장소에 연결하지 못해 이 기기에만 저장됩니다. (Vercel에서 Upstash Redis 연결 후 재배포가 필요합니다. 확인: 주소 뒤에 /api/items 를 붙여 열어보세요.)";return}
  mode="shared";renderAll();
  setInterval(function(){poll().catch(function(){if(++failed===3)toast("연결이 불안정합니다. 잠시 후 다시 시도합니다.")})},4000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)poll().catch(function(){})});
  fetch("/api/weather").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(w){
    if(w&&w.days&&w.days.length){weather=w;renderWeather()}}).catch(function(){});
}
init();
})();
</script>

</body>
</html>
